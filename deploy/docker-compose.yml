# Reference copy of the compose file the home server runs. The server uses its own copy
# in ~/deploy/portfolio and never reads this file from git, so a change to the repo
# cannot change how containers are started (mounts, privileges, networks).
name: golamwasygithubio

services:
  web:
    image: ghcr.io/golamwasy/portfolio-web:latest
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY}
    depends_on:
      - redis
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-app.rule=Host(`golamwasy.dev`)"
      - "traefik.http.routers.portfolio-app.entrypoints=web"
      - "traefik.http.services.portfolio-app.loadbalancer.server.port=3000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - portfolio_redis_data:/data
    networks:
      - traefik-net
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]

  # Loads data/portfolio.json (inside the image) into Redis. Run by deploy.sh after an update.
  seed:
    image: ghcr.io/golamwasy/portfolio-seed:latest
    profiles: ["tools"]
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["node", "scripts/seed-portfolio.mjs"]
    networks:
      - traefik-net
    depends_on:
      - redis

networks:
  traefik-net:
    external: true

volumes:
  portfolio_redis_data:
