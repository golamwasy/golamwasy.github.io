name: Deploy to virus-lab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Write env file
        run: |
          echo "NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}" > .env

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build

      # Redis is read before data/portfolio.json, so reload it on every deploy
      # or content changes in the JSON never reach the live site.
      - name: Seed portfolio content into Redis
        run: |
          # Rebuild the tools-profile image so it contains this commit's JSON.
          docker compose --profile tools run --build --rm seed
