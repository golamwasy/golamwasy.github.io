name: Build images

# Builds on GitHub's own machines and publishes to GHCR. The home server pulls the
# finished images by itself (see deploy/); nothing here can run code on the server.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the site
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-web:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Carries scripts/ and data/portfolio.json so the server can load the content into Redis.
      - name: Build and push the content seeder
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: builder
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-seed:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-seed:${{ github.sha }}
          cache-from: type=gha,scope=web
